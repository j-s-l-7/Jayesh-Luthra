<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light only">
    <meta name="description" content="Jayesh Luthra. Opening February 6, 2027.">
    <title>Jayesh Luthra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1d1d1f;
            --muted: #6e6e73;
            --faint: #a1a1a6;
            --bg: #ffffff;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: max(32px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            max-width: 560px;
            text-align: center;
            animation: rise 1.4s cubic-bezier(.2, .7, .2, 1) both;
        }

        h1 {
            font-size: clamp(40px, min(11vw, 13vh), 72px);
            font-weight: 600;
            letter-spacing: -0.035em;
            line-height: 1.05;
            margin: 0 0 clamp(16px, 4vh, 28px);
        }

        p {
            font-size: clamp(16px, min(4.4vw, 3.6vh), 21px);
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: -0.01em;
            color: var(--muted);
            margin: 0 0 14px;
        }

        .date {
            margin-top: clamp(20px, 5vh, 40px);
            font-size: clamp(11px, 3.2vw, 13px);
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink);
        }

        .rule {
            width: 32px;
            height: 1px;
            background: var(--faint);
            margin: clamp(20px, 5vh, 40px) auto 0;
        }

        footer {
            padding-top: 24px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--faint);
            animation: fade 2s ease 0.8s both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        @keyframes fade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            main, footer { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Hey there.</h1>
        <p>You've arrived a little early.</p>
        <p>Something is being thoughtfully built here, and it isn't quite ready to be seen. Thank you for stopping by.</p>
        <div class="rule"></div>
        <p class="date">Opening February 6, 2027</p>
    </main>
    <footer>Jayesh Luthra</footer>
</body>
</html>
